# Cloud Build → Artifact Registry → Cloud Run
#
# ConnectionStrings__DefaultConnection is set ONCE on the Cloud Run service
# (not passed at build time). Set it after first deploy:
#
#   gcloud run services update ${_SERVICE_NAME} --region=${_REGION} \
#     --update-env-vars='ConnectionStrings__DefaultConnection=Server=HOST;Database=DB;Uid=USER;Pwd=PASS'
#
# The env var persists across subsequent builds/deploys.
#
# Prerequisites (one-time):
#   gcloud services enable cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com
#   gcloud artifacts repositories create ${_REPOSITORY} --repository-format=docker --location=${_REGION}
#
# Submit:
#   gcloud builds submit --config=cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: itransition-templates-app
  _REPOSITORY: itransition-template-manager
  _CLOUD_SQL_INSTANCE: ""
  _MEMORY: 512Mi
  _CPU: "1"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
    waitFor: [build]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
    waitFor: [build]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        DEPLOY_ARGS=(
          run deploy "${_SERVICE_NAME}"
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA"
          --region="${_REGION}"
          --platform=managed
          --allow-unauthenticated
          --port=8080
          --memory="${_MEMORY}"
          --cpu="${_CPU}"
          --min-instances="${_MIN_INSTANCES}"
          --max-instances="${_MAX_INSTANCES}"
        )

        if [[ -n "${_CLOUD_SQL_INSTANCE}" ]]; then
          DEPLOY_ARGS+=(--add-cloudsql-instances="${_CLOUD_SQL_INSTANCE}")
        fi

        gcloud "${DEPLOY_ARGS[@]}"
    waitFor: [push-sha]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

timeout: 1200s
