# Cloud Build → Artifact Registry → Cloud Run
#
# IMPORTANT: `_DB_CONNECTION_STRING` is a Cloud Build SUBSTITUTION only.
# At runtime the app reads Cloud Run env var:
#   ConnectionStrings__DefaultConnection
# (maps to ASP.NET Configuration key ConnectionStrings:DefaultConnection)
#
# Do NOT set an env var named `_DB_CONNECTION_STRING` on Cloud Run — the app ignores it.
#
# Prerequisites (one-time):
#   gcloud services enable cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com
#   gcloud artifacts repositories create ${_REPOSITORY} --repository-format=docker --location=${_REGION}
#
# Submit (pass the DB connection string as a substitution — no spaces after ';'):
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_DB_CONNECTION_STRING='Server=HOST;Database=DB;Uid=USER;Pwd=PASS'
#
# Or set it once on the running service (no rebuild needed):
#   gcloud run services update ${_SERVICE_NAME} --region=${_REGION} \
#     --update-env-vars='ConnectionStrings__DefaultConnection=Server=HOST;Database=DB;Uid=USER;Pwd=PASS'

substitutions:
  # --- Change these for your GCP project ---
  _REGION: us-central1
  _SERVICE_NAME: itransition-templates-app
  _REPOSITORY: itransition-template-manager
  # Passed into Cloud Run as ConnectionStrings__DefaultConnection (must not be empty)
  _DB_CONNECTION_STRING: ""
  # Optional Cloud SQL instance: PROJECT:REGION:INSTANCE (not needed for external MySQL hosts)
  _CLOUD_SQL_INSTANCE: ""
  _MEMORY: 512Mi
  _CPU: "1"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
    waitFor: [build]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
    waitFor: [build]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ -z "${_DB_CONNECTION_STRING}" ]]; then
          echo "ERROR: _DB_CONNECTION_STRING substitution is empty."
          echo "Pass it via --substitutions=_DB_CONNECTION_STRING='Server=...;Database=...;Uid=...;Pwd=...'"
          echo "Or set Cloud Run env ConnectionStrings__DefaultConnection manually after deploy."
          exit 1
        fi

        # Use env-vars-file so '=' and ';' in the MySQL connection string are safe
        printf '%s\n' \
          'ASPNETCORE_ENVIRONMENT: Production' \
          'ASPNETCORE_URLS: http://0.0.0.0:8080' \
          "ConnectionStrings__DefaultConnection: \"${_DB_CONNECTION_STRING}\"" \
          > /workspace/cloud-run-env.yaml

        echo "Deploying with ConnectionStrings__DefaultConnection set (length=${#_DB_CONNECTION_STRING} chars)"

        DEPLOY_ARGS=(
          run deploy "${_SERVICE_NAME}"
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA"
          --region="${_REGION}"
          --platform=managed
          --allow-unauthenticated
          --port=8080
          --memory="${_MEMORY}"
          --cpu="${_CPU}"
          --min-instances="${_MIN_INSTANCES}"
          --max-instances="${_MAX_INSTANCES}"
          --env-vars-file=/workspace/cloud-run-env.yaml
        )

        if [[ -n "${_CLOUD_SQL_INSTANCE}" ]]; then
          DEPLOY_ARGS+=(--add-cloudsql-instances="${_CLOUD_SQL_INSTANCE}")
        fi

        gcloud "${DEPLOY_ARGS[@]}"
    waitFor: [push-sha]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

timeout: 1200s
